name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lightweight-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile core scripts
        run: >
          python -m py_compile
          scripts/dwsim_run_contract.py
          scripts/evaluate/evaluate_repair_output.py
          scripts/evaluate/evaluate_release_set.py
          scripts/llm/run_llm_pilot_batch.py
          scripts/llm/run_gemini_pilot_batch.py
          scripts/maintenance/sanitize_artifact_paths.py
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Check artifact paths
        run: python scripts/maintenance/sanitize_artifact_paths.py --check instances metadata/dwsim_sources docs/dwsim
      - name: Validate release instances
        run: python scripts/validate/validate_instances.py instances/seed --profile release --require-files
      - name: Validate final candidate pool
        run: python scripts/validate/validate_instances.py instances/final_v0_1_5/candidate_pool --profile pilot --require-files
